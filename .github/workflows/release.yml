name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default: the build jobs run third-party actions, dependency
# build scripts and install hooks, none of which may hold a token that can
# publish. Only the job that creates the release asks for more.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7

      # A v* tag can be neither moved nor deleted, so one that disagrees with the
      # version the binary reports stops here, before anything is published.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $V"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      # Build pinned HEX on the runner, before cross embeds it.
      - run: ./scripts/theme.sh

      # The hub embeds the panel, so its dist/ must exist before cargo runs.
      - run: npm ci && npm run build
        working-directory: web-admin

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo install --locked cross
      - run: cross build --release --locked --target ${{ matrix.target }}

      - run: cp "target/${{ matrix.target }}/release/monitor-hub" "monitor-hub-${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-hub-${{ matrix.target }}

  release:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # The Dockerfile lives in the repo; the binaries it copies do not.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      # Only a tag creates a binary release; main (including manual dispatch)
      # publishes a container without cutting an upstream-versioned release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      #
      # sha256sums.txt is generated from inside bin/ so the names in it are bare
      # asset names, which is what install-hub.sh matches before installing the
      # binary into /opt/monitor.
      #
      # install-hub.sh is published with them and hashed alongside: the upgrade
      # path is a re-run of a copy saved on the machine, which may be several
      # releases old, and this entry is what lets that copy recognise itself as
      # such. It is published per release rather than read from main, so the
      # script a release was tested with is the one it is measured against.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp install-hub.sh bin/
          (cd bin && sha256sum monitor-hub-* install-hub.sh > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-hub-* bin/install-hub.sh bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      # The image carries the binary this release already published, so the two
      # cannot disagree on what a given tag contains. docker and buildx ship on
      # the runner, for the same reason gh does above.
      #
      # Both registries receive the same manifest from one build: Docker Hub is
      # where `docker run monitor` looks first, ghcr is what the repository
      # publishes alongside its binaries. A fork without the Docker Hub secrets
      # still gets its ghcr image rather than a failed release.
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          cp bin/monitor-hub-x86_64-unknown-linux-musl monitor-hub-amd64
          cp bin/monitor-hub-aarch64-unknown-linux-musl monitor-hub-arm64
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="-t $IMAGE:sha-$GITHUB_SHA -t $IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="$TAGS -t $IMAGE:$VERSION"
          else
            TAGS="$TAGS -t $IMAGE:main"
          fi
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Same repository name as on GitHub, under the account the token belongs to.
            HUB="docker.io/$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY##*/}"
            TAGS="$TAGS -t $HUB:sha-$GITHUB_SHA -t $HUB:latest"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAGS="$TAGS -t $HUB:$VERSION"; fi
          else
            echo "no Docker Hub credentials configured; publishing to ghcr only"
          fi
          # The default builder cannot produce two platforms in one manifest.
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file image-metadata.json $TAGS .
          echo "### Published $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: latest, sha-$GITHUB_SHA (plus main or release version)" >> "$GITHUB_STEP_SUMMARY"
          cat image-metadata.json >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
